<!doctype html>
<!--
  What marcoinfanti.github.io serves now that the site lives on marcoinfanti.dev.
  GitHub Pages cannot send an HTTP redirect, so this page does it: the script keeps the path, so an
  old link to /table lands on /table; the meta refresh is the fallback without JavaScript. Published
  by `npm run deploy:github-redirect`, which also copies it to 404.html: that copy is what answers
  every path other than /.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marco A. Infanti · marcoinfanti.dev</title>
    <link rel="canonical" href="https://marcoinfanti.dev/" />
    <script>
      location.replace('https://marcoinfanti.dev' + location.pathname + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://marcoinfanti.dev/" />
  </head>
  <body>
    <p>
      Esta web se ha mudado a <a href="https://marcoinfanti.dev/">marcoinfanti.dev</a>. / This site
      has moved to <a href="https://marcoinfanti.dev/">marcoinfanti.dev</a>.
    </p>
  </body>
</html>
